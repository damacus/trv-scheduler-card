# TRV Heating Scheduler - Automation Configuration
#
# This automation checks every minute if the schedule needs to be updated
# and applies the correct temperature to your TRVs based on the current time block.
#
# Installation:
# 1. Copy this to your /config/automations.yaml or create a new file in /config/automations/
# 2. Adjust the climate entities to match your zones
# 3. Restart Home Assistant

automation:
  - id: trv_heating_scheduler_apply
    alias: "TRV Heating Scheduler - Apply Schedule"
    description: "Automatically apply heating schedule to TRVs based on time blocks"
    
    trigger:
      # Check every minute
      - platform: time_pattern
        minutes: "*"
      
      # Also trigger on Home Assistant start
      - platform: homeassistant
        event: start
    
    action:
      # Call the schedule application script
      - service: script.apply_trv_schedule
        data: {}

script:
  apply_trv_schedule:
    alias: "Apply TRV Schedule"
    description: "Reads schedule from input helpers and applies to TRVs"
    sequence:
      # This script will be populated by the card based on your configuration
      # Or you can use the Node-RED flow or AppDaemon app instead
      - service: system_log.write
        data:
          message: "TRV Schedule application triggered"
          level: info

# Input helpers to store schedule data
# These will be created automatically by the card or you can create them manually

# Example for a zone:
input_text:
  living_room_schedule_monday:
    name: "Living Room Schedule - Monday"
    initial: '[]'
    max: 255
  
  living_room_schedule_tuesday:
    name: "Living Room Schedule - Tuesday"
    initial: '[]'
    max: 255
  
  living_room_schedule_wednesday:
    name: "Living Room Schedule - Wednesday"
    initial: '[]'
    max: 255
  
  living_room_schedule_thursday:
    name: "Living Room Schedule - Thursday"
    initial: '[]'
    max: 255
  
  living_room_schedule_friday:
    name: "Living Room Schedule - Friday"
    initial: '[]'
    max: 255
  
  living_room_schedule_saturday:
    name: "Living Room Schedule - Saturday"
    initial: '[]'
    max: 255
  
  living_room_schedule_sunday:
    name: "Living Room Schedule - Sunday"
    initial: '[]'
    max: 255

# Note: The card stores schedules in localStorage by default.
# For persistence across devices and integration with automations,
# you can enable the "Use Input Helpers" option in the card config.
